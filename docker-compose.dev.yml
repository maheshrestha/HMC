# Set the version of docker compose to use
version: '3.9'

# Create a db for dev
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=dev
      - PORT=3000
      - DATABASE_URL=postgresql://hmc_dev_user:hmc_dev_password@db_dev:5432/hmc_dev_db
      - AWS_REGION=ap-southeast-2
    depends_on:
      db_dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
  db_dev:
    image: postgres:13
    # command: postgres -c 'max_connections=5'
    restart: always
    container_name: hmc_dev_db_container_1
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: hmc_dev_user
      POSTGRES_PASSWORD: hmc_dev_password
      POSTGRES_DB: hmc_dev_db
    platform: linux/amd64
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmc_dev_user -d hmc_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5
