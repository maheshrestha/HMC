# Set the version of docker compose to use
version: '3.9'

# Create a db for dev
services:
  db_dev:
    image: postgres:13
    # command: postgres -c 'max_connections=5'
    restart: always
    container_name: hmc_dev_db_container
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: hmc_dev_user
      POSTGRES_PASSWORD: hmc_dev_password
      POSTGRES_DB: hmc_dev_db
    platform: linux/amd64
